<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#3a0a17;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
#app{height:100dvh;max-width:480px;margin:0 auto;background:#f7f3f4;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.hdr{background:linear-gradient(135deg,#812646 0%,#5c192f 55%,#3a0a17 100%);color:#fff;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0;}

.hdr h1{min-width:0;}
.hdr-right{flex-shrink:0;}

.hdr-ver{font-size:9px;font-weight:400;opacity:.45;vertical-align:middle;}
@media (max-width:479px){.hdr-logo{height:26px;}.hdr h1{flex-wrap:wrap;gap:2px 8px;font-size:14px;}.hdr-sep{display:none;}.hdr-title{flex-basis:100%;}}

.user-chip{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}

.prop-btn{font-size:11px;padding:4px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.65);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.prop-btn.act{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.55);}
.prop-name{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;padding-left:1px;height:13px;}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e7e4;flex-shrink:0;}
.tab{flex:1;padding:9px 2px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:#888;border-bottom:2px solid transparent;}
.tab.act{color:#812646;border-bottom-color:#812646;font-weight:600;}
.body{flex:1;overflow-y:auto;background:#f7f3f4;padding:10px;-webkit-overflow-scrolling:touch;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.stat-row{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:8px 10px;}
.stat .n{font-size:22px;font-weight:600;}

.stat.zr .n{color:#A32D2D;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.filter-row::-webkit-scrollbar{display:none;}
.fbtn{font-size:11px;padding:5px 13px;border-radius:12px;border:.5px solid #ccc;background:#fff;color:#666;cursor:pointer;white-space:nowrap;flex-shrink:0;}

.tile.dirty{background:#FEF3F2;border-color:#F09595;}
.tile.zr{background:#E24B4A;border-color:#A32D2D;}

.tile.dep{background:#7B5CD6;border:2px solid #4B2FA8;}
.tile.dep .rnum{color:#fff;}
.tile.dep .sub{color:rgba(255,255,255,.85);font-weight:600;}

.tile.stay{background:#FDECEC;border-color:#F09595;}

.tile.clean{background:#EAF3DE;border-color:#C0DD97;}
.tile.inspect{background:#E6F1FB;border-color:#85B7EB;}
.tile.ooo{background:#F1EFE8;border-color:#D3D1C7;}

.tile.msel{outline:2.5px solid #c8882a;outline-offset:1px;}
.tile .rnum{font-size:16px;font-weight:600;color:#36505d;}
.tile.zr .rnum{color:#fff;}
.tile.dirty .rnum{color:#791F1F;}
.tile.timing .rnum{color:#412402;}
.tile.clean .rnum{color:#27500A;}
.tile.inspect .rnum{color:#0C447C;}
.tile.ooo .rnum{color:#5F5E5A;}
.tile .sub{font-size:9px;margin-top:1px;color:#999;}
.tile.zr .sub{color:rgba(255,255,255,.8);}
.tile .asgn{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:600;padding:1px 5px;border-radius:6px;white-space:nowrap;}
.tile .du-badge{position:absolute;top:5px;left:5px;font-size:9px;font-weight:700;background:#59320f;color:#fff;padding:1px 5px;border-radius:6px;}
.tile .dep-badge{position:absolute;bottom:3px;right:5px;font-size:12px;line-height:1;}
.tile .guest-badge{position:absolute;bottom:3px;left:5px;font-size:12px;line-height:1;}
.tile .dnds-badge{position:absolute;top:5px;right:5px;font-size:12px;line-height:1;}
/* v6.9.0 Rush: zusätzlicher oranger Ring + Schild, Kachelfarben bleiben unverändert */
.tile.rush{box-shadow:0 0 0 3px #E8590C;}
.tile .rush-badge{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#E8590C;color:#fff;font-size:8px;font-weight:800;letter-spacing:.5px;padding:1px 6px;border-radius:6px;white-space:nowrap;z-index:1;}
.rush-btn{width:100%;margin:4px 0 10px;padding:10px;border-radius:9px;border:2px solid #E8590C;background:#fff;color:#E8590C;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.rush-btn.act{background:#E8590C;color:#fff;}
.rush-hint{font-size:13px;font-weight:700;color:#fff;background:#E8590C;border-radius:8px;padding:8px 10px;margin:6px 0 8px;}
.arr-line{font-size:12px;color:#3a0a17;background:#f7f3f4;border:1px solid #e4d3d9;border-radius:8px;padding:7px 10px;margin:6px 0 8px;}
.du-badge-inline{font-size:10px;background:#59320f;color:#fff;padding:2px 7px;border-radius:7px;font-weight:500;}
.du-check-row{display:flex;align-items:center;gap:8px;padding:8px 0 10px;border-bottom:.5px solid #f0efe9;margin-bottom:6px;}
.du-check-row label{font-size:13px;display:flex;align-items:center;gap:7px;cursor:pointer;}
.du-type-row{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 10px;border-bottom:.5px solid #f0efe9;margin-bottom:6px;}
.du-type-btn{font-size:12px;padding:5px 12px;border-radius:7px;border:1px solid #ddd9cc;background:#fff;color:#444;cursor:pointer;}
.du-type-btn.act{background:#59320f;color:#fff;border-color:#59320f;}
.res-comment-box{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:8px 10px;margin:10px 0;}
.res-comment-lbl{font-size:11px;font-weight:600;color:#8a6a1f;margin-bottom:3px;}
.res-comment-txt{font-size:13px;color:#444;white-space:pre-wrap;}
.hk-log-list{margin-top:10px;border-top:.5px solid #f0efe9;padding-top:8px;display:flex;flex-direction:column;gap:6px;}
.hk-log-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;}
.hk-log-room{color:#444;flex:1;}
.hk-log-time{color:#888;}
.hk-log-dur{font-weight:600;min-width:54px;text-align:right;}
.du-list-card{background:#fff;border:1px solid #efece3;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.du-list-room{font-size:14px;font-weight:600;}
.du-list-prop{font-size:11px;color:#888;}
.du-list-types{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.timer-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#EF9F27;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.panel{background:#fff;border-radius:12px;border:.5px solid #e8e7e4;padding:13px;margin-bottom:10px;}
.panel h3{font-family:'Barlow',sans-serif;font-size:16px;font-weight:700;color:#812646;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.zr-badge{font-size:10px;background:#E24B4A;color:#fff;padding:2px 7px;border-radius:7px;font-weight:500;}
.dnds-badge-inline{font-size:10px;background:#8a6a1f;color:#fff;padding:2px 7px;border-radius:7px;font-weight:500;}
.hk-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid #f0efe9;}
.hk-row:last-child{border-bottom:none;}
.hk-info{display:flex;align-items:center;gap:9px;}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.hk-name{font-size:13px;font-weight:500;}
.hk-load{font-size:11px;color:#888;}
.asgn-btn{font-size:11px;padding:5px 11px;border-radius:8px;border:.5px solid #ccc;background:transparent;cursor:pointer;color:#333;}
.asgn-btn.assigned{background:#812646;color:#fff;border-color:#812646;}
.action-btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
.btn-start{background:#3a0a17;color:#fff;}
.btn-done{background:#812646;color:#fff;}
.action-btn-row{display:flex;gap:8px;}
.action-btn-row .action-btn{flex:1;}
.btn-dnds{background:#fff;color:#8a6a1f;border:1.5px solid #e0c584;}
.timer-box{background:#FAEEDA;border:1px solid #FAC775;border-radius:10px;padding:13px;text-align:center;margin:8px 0;}
.timer-lbl{font-size:11px;color:#633806;margin-bottom:3px;}
.timer-val{font-size:32px;font-weight:700;color:#412402;letter-spacing:3px;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#888;}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.rule-card{background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:11px 13px;margin-bottom:8px;border-left-width:3px;}
.rule-card .rt{font-size:13px;font-weight:600;}
.rule-card .rd{font-size:11px;color:#888;margin-top:3px;line-height:1.4;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}
.tog{width:38px;height:22px;border-radius:11px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none;}
.tog.on{background:#812646;}
.tog.off{background:#ccc;}
.tog::after{content:'';position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;}
.tog.on::after{left:19px;}
.tog.off::after{left:3px;}
.stat-card{background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:11px 13px;margin-bottom:8px;}
.bar-bg{background:#f0efe9;border-radius:4px;height:5px;margin-top:7px;overflow:hidden;}
.bar-fill{height:5px;border-radius:4px;}
.sec-title{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;}
.log-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:.5px solid #f0efe9;}
.log-row:last-child{border-bottom:none;}
.team-card{background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:11px 13px;margin-bottom:8px;}
.role-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
.ra{background:#812646;color:#fff;}
.rh{background:#F3E4EA;color:#812646;}
.add-user-btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:#812646;color:#fff;margin-bottom:12px;}
.field-group{margin-bottom:10px;}
.field-label{font-size:11px;color:#888;margin-bottom:4px;display:block;}
.field-input,.field-select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #ddd9d0;background:#fff;font-size:14px;outline:none;color:#812646;}
.field-input:focus,.field-select:focus{border-color:#812646;}
.prop-check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px;}
.prop-check{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;border-radius:8px;border:.5px solid #e8e7e4;background:#fff;}
.prop-check input{accent-color:#812646;}
.form-err{font-size:11px;color:#A32D2D;margin-top:6px;}
.del-btn{font-size:11px;padding:5px 10px;border-radius:8px;border:.5px solid #F09595;background:#FEF3F2;color:#A32D2D;cursor:pointer;flex-shrink:0;}
.del-btn:disabled{opacity:.4;cursor:not-allowed;}
.screen-center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#888;text-align:center;padding:24px;}
.spinner{width:28px;height:28px;border:3px solid #e8e7e4;border-top-color:#812646;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-msg{font-size:13px;color:#A32D2D;max-width:290px;line-height:1.5;}
.retry-btn{padding:9px 22px;border-radius:9px;background:#812646;color:#fff;border:none;font-size:13px;cursor:pointer;margin-top:4px;}
.login-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#812646 0%,#5c192f 55%,#3a0a17 100%);}
.login-logo{width:150px;height:auto;margin-bottom:18px;}
.login-title{font-family:'Barlow',sans-serif;font-size:22px;font-weight:500;letter-spacing:.5px;color:#fff;margin-bottom:2px;}
.login-sub{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:22px;}
.login-input{width:100%;max-width:280px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:14px;margin-bottom:10px;outline:none;}
.login-input::placeholder{color:rgba(255,255,255,.4);}
.login-input:focus{border-color:rgba(255,255,255,.45);}
.login-btn{width:100%;max-width:280px;padding:12px;border-radius:10px;background:#fff;color:#812646;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.login-err{font-size:12px;color:#F09595;max-width:280px;text-align:center;margin-top:8px;}
.logout-btn{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:none;cursor:pointer;}
.toast{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.toast.err{background:#A32D2D;color:#fff;}
.toast.ok{background:#812646;color:#fff;}
.scope-row{display:flex;gap:6px;margin-bottom:10px;}
.break-box{border-radius:10px;padding:10px 13px;text-align:center;margin-bottom:10px;border:1px solid;}
.break-box.idle{background:#EAF3DE;border-color:#C0DD97;}
.break-box.active{background:#FCEBEB;border-color:#F09595;}
.break-val{font-size:22px;font-weight:700;color:#791F1F;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 6px;}
.lang-switch{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);outline:none;cursor:pointer;}
.login-lang{margin-bottom:14px;}
.login-lang select{font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);outline:none;cursor:pointer;}

.refresh-btn{background:transparent;border:none;color:#fff;font-size:15px;cursor:pointer;padding:2px 6px;line-height:1;opacity:.85;}
.refresh-btn:active{opacity:1;}
.refresh-btn.spin{animation:hk-spin .7s linear;}
@keyframes hk-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.month-select{font-size:11px;padding:5px 9px;border-radius:12px;border:.5px solid #ccc;background:#fff;color:#666;cursor:pointer;}
.export-btn{background:#27500A;color:#fff;border-color:#27500A;}

/* ===== Responsive: Smartphone (default) / Tablet / Laptop & Desktop ===== */
@media (min-width:640px){
  #app{max-width:720px;}

  #app{max-width:1000px;}

:root{--mk-berry:#812646;--mk-deep:#3a0a17;}
.panel h3,.sec-title{color:#812646;}

// Reservierungskommentare kommen vom Gast oder der OTA (Booking.com etc.) und
// landen unverändert in u.cm. Vor jeder innerHTML-Ausgabe escapen, sonst kann
// ein präparierter Kommentar Script im Browser der Reinigungskraft ausführen.
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Ersetzt das bloße Vertrauen auf eine in localStorage gespeicherte User-Id —

function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } }

async function apiFetch(path, method='GET', body=null) {
  const res = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path, method, body, token: getToken()}),
  });
  const text = await res.text();
  if (!res.ok) {
    let msg = text;
    try { const j = JSON.parse(text); msg = j.error || j.detail || j.title || j.message || (Object.keys(j).length ? text : ''); } catch {}
    throw new Error('HTTP ' + res.status + (msg ? ': ' + msg : ' (keine Detailmeldung von Apaleo)'));
  }
  return text ? JSON.parse(text) : {};
}

async function fetchPropertyData(propId) {
  const today = new Date(); today.setHours(0,0,0,0);
  const pad2 = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  const todayStr = ymd(today);
  const fromISO = todayStr+'T00:00:00Z';
  const toISO = todayStr+'T23:59:59Z';
  const [ud, rd, dd, ad] = await Promise.all([
    apiFetch('/inventory/v1/units?propertyId='+propId+'&pageSize=500'),
    apiFetch('/booking/v1/reservations?propertyIds='+propId+'&status=InHouse&pageSize=500'),
    // alle Zimmer mit Abreise HEUTE (egal ob noch InHouse oder schon CheckedOut),
    // damit der Koffer auch nach dem Checkout bis zur Reinigung sichtbar bleibt
    apiFetch('/booking/v1/reservations?propertyIds='+propId+'&status=InHouse&status=CheckedOut&dateFilter=Departure&from='+fromISO+'&to='+toISO+'&pageSize=500'),
    // alle Anreisen HEUTE (egal ob schon eingecheckt oder noch nicht) — bei Zimmern
    // mit Abreise UND Anreise am selben Tag muss der Reinigungs-Kommentar von der
    // Folgereservierung kommen, nicht vom abreisenden Gast
    apiFetch('/booking/v1/reservations?propertyIds='+propId+'&status=Confirmed&status=InHouse&dateFilter=Arrival&from='+fromISO+'&to='+toISO+'&pageSize=500'),
  ]);
  // Datum aus Apaleo-String ("2026-10-05T15:00:00+02:00" oder "2026-10-05") als
  // LOKALE Mitternacht parsen. Vorher: new Date('2026-10-05') = UTC-Mitternacht →
  // in DE (UTC+1/+2) fehlten 1–2 Stunden, Math.floor ergab eine Nacht zu wenig →
  // ZR kam an Nacht 3/5/7 statt 2/4/6 (bzw. gar nicht, wenn der Gast vorher abreiste).
  const dayOf = s => { const [y,m,d]=String(s||'').split('T')[0].split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
  const depToday = r => !!r?.departure && String(r.departure).split('T')[0]===todayStr;
  const resMap = {};
  // Bei mehreren InHouse-Reservierungen auf einem Zimmer (abreisender Gast noch
  // nicht ausgecheckt + neuer Gast schon eingecheckt) die BLEIBENDE Reservierung
  // nehmen — sonst hing die ZR-Berechnung vom Zufall der API-Reihenfolge ab.
  (rd.reservations||[]).forEach(r => {
    const uid = r.unit?.id||r.unitId; if(!uid) return;
    const prev = resMap[uid];
    if(!prev || (depToday(prev) && !depToday(r))) resMap[uid]=r;
  });
  const depUnits = new Set();
  (dd.reservations||[]).forEach(r => { const uid = r.unit?.id||r.unitId; if(uid) depUnits.add(uid); });
  const arrMap = {};
  (ad.reservations||[]).forEach(r => { const uid = r.unit?.id||r.unitId; if(!uid) return;
    // noch nicht eingecheckte Anreise bevorzugen
    if(!arrMap[uid] || (arrMap[uid].status!=='Confirmed' && r.status==='Confirmed')) arrMap[uid]=r; });
  return (ud.units||[]).map(u => {
    const res = resMap[u.id];
    // Math.round statt floor: robust gegen Sommer-/Winterzeitwechsel (23h/25h-Tage).
    const nights = res ? Math.max(0, Math.round((today - dayOf(res.arrival)) / 86400000)) : 0;
    // Gast reist heute ab → Abreise-Reinigung, keine Zwangsreinigung.
    const leaving = !res || depToday(res);
    // Same-Day-Turnover: Abreise + Anreise am selben Tag → Kommentar der Folgereservierung
    // zeigen (relevant für die Vorbereitung des Zimmers), nicht den des abreisenden Gasts.
    const turnoverRes = depUnits.has(u.id) ? arrMap[u.id] : null;
    const cm = turnoverRes ? (turnoverRes.comment||'') : (res?.comment||'');
    // Anreise heute (v6.9.0): noch nicht eingecheckte Reservierung mit Anreise heute
    // → Zimmer muss heute fertig werden (Abreise→Anreise oder leeres Zimmer).
    const arr = arrMap[u.id];
    const aT = !!arr && arr.status==='Confirmed';
    const aTime = aT ? ((String(arr.arrival||'').split('T')[1]||'').slice(0,5)) : '';
    return { id:u.id, n:u.name, c:(u.status?.condition||u.condition)||'Clean', o:!!res||u.status?.isOccupied, nights, dT:depUnits.has(u.id), leaving, cm, aT, aTime };
  });
}

const rKey    = (p,n) => p+'_'+n;
// Zwangsreinigung (ZR): alle 2 Nächte (Nacht 2, 4, 6 ...) bei belegten Zimmern —
// ODER Gast hat per QR-Code/guest.html eine Wunschreinigung angefordert
// (S.guestClean, siehe api/guestclean.js). Beide Fälle setzen weiterhin
// voraus, dass das Zimmer laut Apaleo tatsächlich "Dirty" ist — eine
// Gastanfrage kann ein frisch gereinigtes Zimmer nicht rückwirkend
// "schmutzig" machen, sie greift, sobald es das nächste Mal wieder Dirty ist.
const isGuestClean = (u,p=S.prop) => !!S.guestClean[rKey(p,u.n)];
// Abreise-Zimmer (Gast reist heute ab) sind nie ZR — dort steht ohnehin die
// komplette Abreise-Reinigung an. Zustand über getCond (inkl. lokaler Änderung).
const isZR    = (u,p=S.prop) => getCond(u,p)==='Dirty'&&u.o&&!(u.dT&&u.leaving)&&(isGuestClean(u,p)||(u.nights>=2&&u.nights%2===0));
// Dreckige Abreise: heute abreisend ODER leerstehend & schmutzig (komplette Reinigung).
// Dreckige Bleibe: belegt, Gast bleibt, keine ZR (Standard-Bleibereinigung).
const isDepDirty = (u,p=S.prop) => getCond(u,p)==='Dirty'&&!isZR(u,p)&&(u.dT||!u.o);
// DNDS ("Gast wollte keine Störung") wird nicht separat gespeichert, sondern aus
// dem Reinigungs-Log abgeleitet (type:'dnds') und gilt nur für den aktuellen Tag —
// setzt sich also automatisch um Mitternacht zurück, ohne dass jemand manuell
// eingreifen muss.
const isDNDSToday = (u,p=S.prop) => {
  const d=new Date(); d.setHours(0,0,0,0);
  return S.completedTimes.some(tm=>tm.type==='dnds'&&tm.prop===p&&tm.room===u.n&&tm.ts>=d.getTime());
};
const getCond = (u,p) => S.conditions[rKey(p,u.n)]||u.c;
// Rush (v6.9.0): von Admin/Hausdame gesetzt, gilt nur am selben Tag.
const isRushKey = k => { const r=S.rush[k]; if(!r) return false; const d=new Date(); d.setHours(0,0,0,0); return (r.ts||0)>=d.getTime(); };
const isRush = (u,p=S.prop) => isRushKey(rKey(p,u.n));
// Reihenfolge: 1) Rush, 2) Anreise heute & noch zu reinigen, 3) Rest (Apaleo-Reihenfolge).
const needsWork = (u,p=S.prop) => { const c=getCond(u,p); return c==='Dirty'||(c==='Clean'&&hasDU(rKey(p,u.n))); };
const roomPrio = (u,p=S.prop) => (isRush(u,p)&&needsWork(u,p))?0:(u.aT&&getCond(u,p)==='Dirty')?1:2;
const fmtDur  = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fmtDurL = s => { const m=Math.floor(s/60); return m<1?s+'s':m+' min '+s%60+'s'; };
const fmtTime = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const fmtDate = ts => { const d=new Date(ts); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'; };
const tcls    = c => ({Clean:'clean',Dirty:'dirty',CleanToBeInspected:'inspect',OutOfService:'ooo',OutOfOrder:'ooo'}[c]||'dirty');
const hasDU   = k => !!S.doubleUp[k] || (S.doubleUpType[k]||[]).length>0;

function getStats(p) {
  let dirty=0,zr=0,insp=0,clean=0,dep=0;
  (S.units[p]||[]).forEach(u=>{const c=getCond(u,p);if(isZR(u,p))zr++;else if(c==='Dirty'){dirty++;if(isDepDirty(u,p))dep++;}else if(c==='CleanToBeInspected')insp++;else if(c==='Clean')clean++;});
  return{dirty,zr,insp,clean,dep};
}

      if(el2){ el2.textContent=fmtDur(Math.floor((Date.now()-ba.start)/1000)); alive=true; }
    }
    if(!alive) stopTimerIv();

}

// Lokale Zustands-Overrides (S.conditions) nur kurz behalten, bis Apaleo die
// Änderung bestätigt hat. Vorher blieben sie bis zum Neuladen der Seite stehen:
// ein gestern auf "Clean" gesetztes Zimmer blieb auf einem über Nacht offenen
// Tablet "Clean", obwohl Apaleo es nach dem Nachtlauf wieder auf "Dirty" setzte
// → ZR wurde nicht angezeigt.
function pruneConditionOverrides(p){
  const now=Date.now();
  Object.keys(S.conditions).forEach(k=>{
    if(!k.startsWith(p+'_')) return;
    if(!S.condTs[k] || now-S.condTs[k] > 2*60*1000){ delete S.conditions[k]; delete S.condTs[k]; }
  });
}

function STATS_PERIODS(){ return {today:t('period_today'),month:t('period_month'),ytd:t('period_ytd')}; }
const STATS_LOCALE = {de:'de-DE',en:'en-US',sq:'sq-AL',uk:'uk-UA',tr:'tr-TR',sr:'sr-RS',hr:'hr-HR'};
function monthOptions(n){
  const arr=[]; const now=new Date(); const loc=STATS_LOCALE[S.lang]||'de-DE';
  for(let i=0;i<(n||24);i++){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let label; try{ label=d.toLocaleDateString(loc,{month:'long',year:'numeric'}); }catch(e){ label=val; }
    arr.push({val,label});
  }
  return arr;
}
function statsRange(period, monthVal){
  const now=new Date();
  if(period==='custom'&&monthVal){
    const parts=monthVal.split('-').map(Number), y=parts[0], m=parts[1];
    const from=new Date(y,m-1,1).getTime();
    const to=Math.min(new Date(y,m,1).getTime()-1, Date.now());
    return {from,to};
  }
  if(period==='today'){ const d=new Date();d.setHours(0,0,0,0); return {from:d.getTime(), to:Date.now()}; }
  if(period==='month'){ return {from:new Date(now.getFullYear(),now.getMonth(),1).getTime(), to:Date.now()}; }
  return {from:new Date(now.getFullYear(),0,1).getTime(), to:Date.now()};
}
function scrStats(){
  const period=S.statsPeriod||'today';
  const monthVal=S.statsMonth;
  const PERIODS=STATS_PERIODS();
  const {from,to}=statsRange(period,monthVal);
  let periodLabel=PERIODS[period];
  if(period==='custom'&&monthVal){ const mo=monthOptions(36).find(o=>o.val===monthVal); periodLabel=mo?mo.label:monthVal; }
  // Nach dem oben gewählten Standort (S.prop) filtern — vorher ignorierte die
  // Statistik den Haus-Filter komplett und zeigte immer alle Häuser gemischt.
  const all=S.completedTimes.filter(tm=>tm.ts>=from&&tm.ts<=to&&tm.prop===S.prop);
  // DNDS-Meldungen sind keine abgeschlossenen Reinigungen (duration:0) und dürfen
  // die Kennzahlen (Ø Zeit, Schnellste, Zimmeranzahl) nicht verfälschen — sie
  // fließen nur in die "Letzte Abschlüsse"-Liste und das Personen-Log ein.
  const cleaned=all.filter(tm=>tm.type!=='dnds');
  const allBreaks=S.breakLog.filter(b=>b.start>=from&&b.start<=to);
  const tot=cleaned.length,avg=tot?Math.round(cleaned.reduce((s,tm)=>s+tm.duration,0)/tot):0;
  const fast=tot?Math.min(...cleaned.map(tm=>tm.duration)):0;
  const hks=getHKs(S.prop);
  const maxA=Math.max(1,...hks.map(h=>{const ht=cleaned.filter(tm=>tm.uid===h.id);return ht.length?Math.round(ht.reduce((s,tm)=>s+tm.duration,0)/ht.length):0;}));
  const moOpts=monthOptions();
  return `<div class="filter-row">${Object.entries(PERIODS).map(([k,l])=>`<button class="fbtn${period===k?' act':''}" onclick="ev_statsPeriod('${k}')">${l}</button>`).join('')}
  <select class="fbtn month-select" onchange="ev_statsMonth(this.value)">
  <option value="">${t('period_pick_month')}</option>
  ${moOpts.map(o=>`<option value="${o.val}"${period==='custom'&&monthVal===o.val?' selected':''}>${o.label}</option>`).join('')}
  </select>
  <button class="fbtn export-btn" onclick="ev_exportExcel()">📊 ${t('export_excel_btn')}</button>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="n">${tot}</div><div class="l">${t('stat_room_count')}</div></div>
    <div class="stat"><div class="n">${tot?fmtDur(avg):'—'}</div><div class="l">${t('stat_avg_time')}</div></div>
    <div class="stat"><div class="n">${fast?fmtDur(fast):'—'}</div><div class="l">${t('stat_fastest')}</div></div>
  </div>
  <div class="sec-title">${t('performance_title',{period:(periodLabel||'').toLowerCase()})}</div>
  ${hks.map(h=>{const ht=cleaned.filter(tm=>tm.uid===h.id),cnt=ht.length,a=cnt?Math.round(ht.reduce((s,tm)=>s+tm.duration,0)/cnt):0,pct=a?Math.round(a/maxA*100):0;
  const dt=all.filter(tm=>tm.uid===h.id&&tm.type==='dnds');
  const hb=allBreaks.filter(b=>b.uid===h.id),bTotal=hb.reduce((s,b)=>s+b.duration,0);
  const open=S.statsPerson===h.id;
  const timeline=[...ht.map(tm=>({type:'clean',ts:tm.ts,t:tm})),...dt.map(tm=>({type:'dnds',ts:tm.ts,t:tm})),...hb.map(b=>({type:'break',ts:b.end,b}))].sort((x,y)=>y.ts-x.ts);
  return`<div class="stat-card" style="cursor:pointer;" onclick="ev_statsPerson('${h.id}')"><div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:9px;"><div class="avatar" style="width:34px;height:34px;font-size:12px;background:${h.bg};color:${h.tx}">${h.id}</div>
    <div><div style="font-size:13px;font-weight:500;">${h.name}</div><div style="font-size:11px;color:#888;">${h.props.join(', ')}</div></div></div>
    <div style="text-align:right;"><div style="font-size:14px;font-weight:600;">${cnt} ${t('rooms_word')}</div><div style="font-size:11px;color:#888;">Ø ${a?fmtDurL(a):'—'}</div></div>
  </div>${a?`<div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${h.bg};"></div></div>`:''}
  <div style="font-size:11px;color:#888;margin-top:6px;">☕ ${hb.length} ${t('breaks_label')}${bTotal?' · '+fmtDurL(bTotal):''}</div>
  ${open?`<div class="hk-log-list">${timeline.length?timeline.map(e=>e.type==='clean'?`<div class="hk-log-row">
      <span class="hk-log-room">${t('log_room_prefix')} ${e.t.room} · ${e.t.prop}${e.t.kind?` · ${e.t.kind==='departure'?t('legend_departure'):t('sub_stay')}`:''}</span>
      <span class="hk-log-time">${fmtDate(e.t.ts)} · ${fmtTime(e.t.ts-e.t.duration*1000)} – ${fmtTime(e.t.ts)}</span>
      <span class="hk-log-dur">${fmtDurL(e.t.duration)}</span>
    </div>`:e.type==='dnds'?`<div class="hk-log-row">
      <span class="hk-log-room">⛔ ${t('log_room_prefix')} ${e.t.room} · ${e.t.prop}</span>
      <span class="hk-log-time">${fmtDate(e.t.ts)} · ${fmtTime(e.t.ts)}</span>

async function ev_saveUser(){
  const editing = !!S.editUserId;
  const id = editing ? S.editUserId : (document.getElementById('nu-id').value||'').trim().toUpperCase();
  const name = (document.getElementById('nu-name').value||'').trim();
  const pass = (document.getElementById('nu-pass').value||'').trim();
  const role = document.getElementById('nu-role').value;
  const lang = document.getElementById('nu-lang').value;
  const allProps = document.getElementById('nu-prop-alle').checked;
  const props = allProps ? ['alle'] : Array.from(document.querySelectorAll('.nu-prop:checked')).map(cb=>cb.value);

  if(editing){
    if(!name){ S.userFormErr=t('err_fill_fields_edit'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
  }else{
    if(!id||!name||!pass){ S.userFormErr=t('err_fill_fields'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
    if(USERS.some(u=>u.id.toLowerCase()===id.toLowerCase())){ S.userFormErr=t('err_username_exists'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
  }
  if(!props.length){ S.userFormErr=t('err_pick_house'); document.getElementById('hkc').innerHTML=buildScreen(); return; }

  S.userBusy=true; S.userFormErr=''; document.getElementById('hkc').innerHTML=buildScreen();
  try{
    if(editing){
      const user = {id,name,role,props,lang};
      if(pass) user.pass = pass;
      await usersApiFetch({action:'update',user});
      const u = USERS.find(x=>x.id===id);
      if(u) Object.assign(u,user);
      S.userBusy=false; S.userFormOpen=false; S.editUserId=null;
      if(S.currentUser && S.currentUser.id===id) Object.assign(S.currentUser,user);
      showToast(t('user_updated',{name}),'ok');
    }else{
      const col = pickColor(id);
      const user = {id,name,pass,role,props,lang,bg:col.bg,tx:col.tx};
      await usersApiFetch({action:'create',user});
      USERS.push(user);
      S.userBusy=false; S.userFormOpen=false;
      showToast(t('user_created',{name}),'ok');
    }
  }catch(e){
    S.userBusy=false; S.userFormErr=t('err_generic',{msg:e.message});
    document.getElementById('hkc').innerHTML=buildScreen();
  }
}
async function ev_deleteUser(id){
  if(S.currentUser && S.currentUser.id===id) return;

  try{

function ev_exportExcel(){
  if(typeof XLSX==='undefined'){ showToast('Excel-Bibliothek konnte nicht geladen werden — bitte Internetverbindung prüfen.','err'); return; }
  const period=S.statsPeriod||'today', monthVal=S.statsMonth;
  const {from,to}=statsRange(period,monthVal);
  const all=S.completedTimes.filter(tm=>tm.ts>=from&&tm.ts<=to&&tm.prop===S.prop);
  const cleaned=all.filter(tm=>tm.type!=='dnds');
  const allBreaks=S.breakLog.filter(b=>b.start>=from&&b.start<=to);
  const hks=getHKs(S.prop);
  const summaryRows=hks.map(h=>{
    const ht=cleaned.filter(tm=>tm.uid===h.id), cnt=ht.length;
    const totalSec=ht.reduce((s,tm)=>s+tm.duration,0);
    const avgSec=cnt?Math.round(totalSec/cnt):0;
    const hb=allBreaks.filter(b=>b.uid===h.id), breakTotal=hb.reduce((s,b)=>s+b.duration,0);
    return { 'Housekeeper':h.name, 'Zimmer gereinigt':cnt, 'Ø Zeit':cnt?fmtDurL(avgSec):'—', 'Gesamtzeit':cnt?fmtDurL(totalSec):'—', 'Pausen':hb.length, 'Pausenzeit':breakTotal?fmtDurL(breakTotal):'—' };
  });
  const detailRows=all.slice().sort((a,b)=>a.ts-b.ts).map(tm=>{
    const u=USERS.find(x=>x.id===tm.uid);
    const d=new Date(tm.ts);
    const dateStr=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
    const typeLabel = tm.type==='dnds' ? 'DNDS' : (tm.kind==='departure' ? 'Abreise' : 'Aufenthalt');
    return { 'Datum':dateStr, 'Uhrzeit':fmtTime(tm.ts), 'Zimmer':tm.room, 'Objekt':PROPERTY_NAMES[tm.prop]||tm.prop, 'Housekeeper':u?u.name:tm.uid, 'Dauer':tm.type==='dnds'?'—':fmtDurL(tm.duration), 'Typ':typeLabel };
  });
  const wb=XLSX.utils.book_new();
  const wsSummary=XLSX.utils.json_to_sheet(summaryRows.length?summaryRows:[{'Hinweis':'Keine Daten im gewählten Zeitraum'}]);
  const wsDetails=XLSX.utils.json_to_sheet(detailRows.length?detailRows:[{'Hinweis':'Keine Daten im gewählten Zeitraum'}]);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Zusammenfassung');
  XLSX.utils.book_append_sheet(wb, wsDetails, 'Details');
  const propLabel=(PROPERTY_NAMES[S.prop]||S.prop||'Alle').replace(/[^a-zA-Z0-9]+/g,'_');
  const periodTag=(period==='custom'&&monthVal)?monthVal:period;
  const fname=`Housekeeping_Statistik_${propLabel}_${periodTag}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast('Excel-Export erstellt: '+fname,'ok');
}

function persistDoubleUp(k){
  const need=!!S.doubleUp[k], types=S.doubleUpType[k]||[], locked=!!S.doubleUpLocked[k];
  if(!need&&!types.length){
    delete S.doubleUp[k]; delete S.doubleUpType[k]; delete S.doubleUpLocked[k];
    pushDoubleUp('clear',k).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  } else {
    pushDoubleUp('set',k,types,locked,need).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  }
}
function ev_toggleDoubleUp(k){
  S.doubleUp[k]=!S.doubleUp[k];
  if(S.doubleUp[k]&&!S.doubleUpType[k]) S.doubleUpType[k]=[];
  persistDoubleUp(k);
  document.getElementById('hkc').innerHTML=buildScreen();
}
function ev_setDoubleUpType(k,dtp){
  const a=S.doubleUpType[k]||(S.doubleUpType[k]=[]); const i=a.indexOf(dtp); i>-1?a.splice(i,1):a.push(dtp);
  persistDoubleUp(k);
  document.getElementById('hkc').innerHTML=buildScreen();
}
function ev_startTimer(k){
  if(hasDU(k)&&S.doubleUpLocked[k]){
    delete S.doubleUp[k]; delete S.doubleUpType[k]; delete S.doubleUpLocked[k];
    pushDoubleUp('clear',k).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_reset',{msg:r.msg||t('unknown_error')}),'err'); });
  }
  S.timers[k]={start:Date.now(),uid:S.currentUser.id}; document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
}
// DNDS ("Do Not Disturb") — Alternative zu "Reinigung starten": der Gast wollte
// nicht gestört werden. Zimmer bleibt Dirty/ZR (wird NICHT als gereinigt
// markiert), die Meldung wird nur als Log-Eintrag (type:'dnds', duration:0) in
// der Statistik festgehalten und gilt automatisch nur für den heutigen Tag.
async function ev_dnds(k){
  const pts=k.split('_');
  const entry={uid:S.currentUser.id,prop:pts[0],room:pts.slice(1).join('_'),duration:0,ts:Date.now(),type:'dnds'};
  S.completedTimes.push(entry);
  S.selRoom=null;
  render();
  const r=await pushCompletion(entry);
  if(!r.ok) showToast(t('err_completion_not_saved',{msg:r.msg||t('unknown_error')}),'err');
}
async function ev_toggleBreak(){
  const uid=S.currentUser.id;
  const active=S.breakActive[uid];
  if(active){
    const end=Date.now(),duration=Math.floor((end-active.start)/1000);
    delete S.breakActive[uid];
    const entry={uid,start:active.start,end,duration};
    S.breakLog.push(entry);
    stopTimerIv(); document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
    const r=await pushBreak(entry);
    if(!r.ok) showToast(t('err_break_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  } else {
    S.breakActive[uid]={start:Date.now()};
    stopTimerIv(); document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
  }
}
async function ev_inspect(k){
  const u=(S.units[S.prop]||[]).find(x=>x.n===k.split('_').slice(1).join('_'));
  let entry=null;
  if(S.timers[k]){ const dur=Math.floor((Date.now()-S.timers[k].start)/1000),pts=k.split('_');
    // kind unterscheidet Bleibe-Reinigung (inkl. Zwangsreinigung, ZR) von
    // Abreise-Reinigung — Grundlage ist u.dT (Zimmer hat heute eine Abreise).
    entry={uid:S.timers[k].uid,prop:pts[0],room:pts.slice(1).join('_'),duration:dur,ts:Date.now(),kind:(u&&u.dT)?'departure':'stay'};
    S.completedTimes.push(entry); delete S.timers[k]; }
  S.conditions[k]='CleanToBeInspected'; S.condTs[k]=Date.now(); S.selRoom=null;
  // Zuweisung an den Housekeeper wird nach erfolgreicher Reinigung entfernt —
  // Zimmer ist fertig, das Housekeeping-Team ist wieder frei für neue Zimmer.
  const hadAssignment=!!S.assignments[k];
  if(hadAssignment) delete S.assignments[k];
  if(hasDU(k)&&!S.doubleUpLocked[k]){
    S.doubleUpLocked[k]=true;
    pushDoubleUp('set',k,S.doubleUpType[k]||[],true,!!S.doubleUp[k]).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  }
  // Gast-Wunschreinigung ist erledigt, sobald das Zimmer zur Inspektion
  // übergeben wird — Markierung sofort entfernen (kein Lock-Zyklus wie beim
  // Aufdoppeln, da die Anfrage pro Reinigungswunsch nur einmal gilt).
  const hadGuestClean=!!S.guestClean[k];
  if(hadGuestClean) delete S.guestClean[k];
  clearRushAfterClean(k);
  if(u) u.c='CleanToBeInspected';
  render();
  if(u?.id){
    const r=await pushCondition(u.id,'CleanToBeInspected');
    if(!r.ok) showToast(t('err_condition_not_synced',{msg:r.msg||t('unknown_error')}),'err');
  }
  if(entry){
    const r=await pushCompletion(entry);
    if(!r.ok) showToast(t('err_completion_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
  if(hadAssignment){
    const r=await pushAssignment('clear',k);
    if(!r.ok) showToast(t('err_assignment_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
  if(hadGuestClean){
    const r=await pushGuestCleanClear(k);
    if(!r.ok) showToast(t('err_guestclean_not_cleared',{msg:r.msg||t('unknown_error')}),'err');
  }
}

async function ev_completeDoubleUp(k){
  let entry=null;
  if(S.timers[k]){ const dur=Math.floor((Date.now()-S.timers[k].start)/1000),pts=k.split('_');
    entry={uid:S.timers[k].uid,prop:pts[0],room:pts.slice(1).join('_'),duration:dur,ts:Date.now()};
    S.completedTimes.push(entry); delete S.timers[k]; }
  S.selRoom=null;
  // Zuweisung wird auch beim Abschluss einer reinen Aufdoppeln-Aufgabe entfernt.
  const hadAssignment=!!S.assignments[k];
  if(hadAssignment) delete S.assignments[k];
  clearRushAfterClean(k);
  render();
  if(entry){
    const r=await pushCompletion(entry);
    if(!r.ok) showToast(t('err_completion_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
  if(hadAssignment){
    const r=await pushAssignment('clear',k);
    if(!r.ok) showToast(t('err_assignment_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
}

async function ev_completeInspection(k){
  S.conditions[k]='Clean'; S.condTs[k]=Date.now(); S.selRoom=null;
  const u=(S.units[S.prop]||[]).find(x=>x.n===k.split('_').slice(1).join('_'));
  if(u) u.c='Clean';
  render();
  if(u?.id){
    const r=await pushCondition(u.id,'Clean');
    if(!r.ok) showToast(t('err_condition_not_synced',{msg:r.msg||t('unknown_error')}),'err');
  }
}

// Zimmer-/Reservierungsdaten (u.a. dT="Abreise heute") werden sonst nur einmal
// pro Sitzung geladen und können veralten, wenn ein Gerät über Stunden oder
// über Nacht offen bleibt — z.B. wurde eine Abreise-Reinigung fälschlich als
// "Bleibe" geloggt, weil der Tab seit vor dem Check-out offen war. Deshalb hier
// zusätzlich alle 10 Minuten sowie beim Wieder-Sichtbarwerden des Tabs (Gerät
// aufgewacht) neu laden.
let unitsRefreshIv=null;
async function refreshCurrentUnits(){
  if(!S.loggedIn||!S.prop) return;
  try{ const [us]=await Promise.all([loadUnits(S.prop), loadAssignments()]); S.units[S.prop]=us; render(); }
  catch(e){ console.warn('[refreshCurrentUnits] Konnte Zimmerdaten nicht aktualisieren', e.message); }
}
function startUnitsAutoRefresh(){
  if(unitsRefreshIv) return;
  unitsRefreshIv=setInterval(refreshCurrentUnits, 10*60*1000);
  // v6.9.0: Zuweisungen + Rush jede Minute abgleichen, damit Housekeeper neue
  // Zimmer/Rush ohne Neuladen sehen. Neu gezeichnet wird nur bei Änderung.
  setInterval(async()=>{
    if(!S.loggedIn||document.visibilityState!=='visible') return;
    const before=JSON.stringify([S.assignments,S.rush]);
    await loadAssignments();
    if(JSON.stringify([S.assignments,S.rush])!==before && S.screen==='rooms' && !S.multiSelect) render();
  }, 60*1000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') refreshCurrentUnits(); });
}

// Manueller Refresh-Button (v.a. für Tablet/Handy im "Zum Homescreen hinzufügen"-Modus):
// dort bleibt die App sonst als alte JS-Version im Speicher, bis sie manuell
// geschlossen und neu geöffnet wird. Cache/Service-Worker vorsorglich leeren
// und die Seite mit Cache-Buster neu laden, damit garantiert die neueste
// deployte Version kommt.
async function ev_hardRefresh(btn){
  if(btn) btn.classList.add('spin');
  showToast(t('refresh_toast'),'ok');
  try{
    if(window.caches && caches.keys){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){ const regs=await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
  }catch(e){}
  setTimeout(()=>{ location.href = location.pathname + '?_r=' + Date.now(); }, 300);
}

async function init(){
  console.log('[MK Housekeeping] Version', APP_VERSION);
  await Promise.all([loadUsers(), loadCompletions(), loadDoubleUps(), loadBreaks(), loadAssignments(), loadGuestClean()]);
  if(!S.loggedIn && getToken()){
    try{
      const r = await usersApiFetch({action:'whoami'});
      S.loggedIn=true; S.currentUser=r.user; S.role=r.user.role; if(r.user.lang) S.lang=r.user.lang;
    }catch(e){
      // Token abgelaufen/ungültig — alte Sitzung verwerfen, Login erneut anfordern.
      try{ localStorage.removeItem(LOGIN_KEY); }catch(_){}
      setToken('');
    }
  }
  if(!S.loggedIn){ render(); return; }

  document.getElementById('app').innerHTML=`<div class="screen-center"><div class="spinner"></div><p style="font-size:13px">${t('loading_apaleo')}</p></div>`;
  try{
    const allowed=userProps(S.currentUser);
    const props=await fetchProperties(allowed);
    S.properties=props.length>0?props:allowed.filter(id=>id in PROPERTY_NAMES).map(id=>({id,name:PROPERTY_NAMES[id]}));
    S.prop=S.properties[0]?.id||allowed[0];
    S.loadingProp=true; render();
    S.units[S.prop]=await loadUnits(S.prop);
    S.loadingProp=false; render();
    startUnitsAutoRefresh();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="screen-center">
      <p style="font-size:22px">⚠️</p>
      <p class="err-msg">${e.message}</p>
      <button class="retry-btn" onclick="init()">${t('retry_btn')}</button>
      <button style="margin-top:10px;background:none;border:none;color:#888;font-size:12px;text-decoration:underline;cursor:pointer;" onclick="ev_logout()">${t('logout_btn')}</button>
    </div>`;
  }
}

init();
</script>
