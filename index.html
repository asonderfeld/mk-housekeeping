*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:#36505d;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
#app{height:100dvh;max-width:480px;margin:0 auto;background:#f8f3e9;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.hdr{background:#36505d;color:#fff;padding:10px 14px 8px;padding-top:calc(10px + env(safe-area-inset-top));flex-shrink:0;}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.hdr h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.user-chip{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);}
.role-badge{font-size:11px;font-weight:600;padding:3px 11px;border-radius:20px;cursor:pointer;border:none;outline:none;}

.prop-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;}
.prop-row::-webkit-scrollbar{display:none;}
.prop-btn{font-size:11px;padding:4px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.65);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.prop-btn.act{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.55);}
.prop-name{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;padding-left:1px;height:13px;}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e7e4;flex-shrink:0;}
.tab{flex:1;padding:9px 2px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:#888;border-bottom:2px solid transparent;}
.tab.act{color:#36505d;border-bottom-color:#c8882a;}
.body{flex:1;overflow-y:auto;background:#f8f3e9;padding:10px;-webkit-overflow-scrolling:touch;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
.stat-row{display:flex;gap:8px;margin-bottom:10px;}
.stat{flex:1;background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:8px 10px;}
.stat .n{font-size:22px;font-weight:600;}
.stat .l{font-size:11px;color:#888;margin-top:1px;}
.stat.zr .n{color:#A32D2D;}
.filter-row{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.filter-row::-webkit-scrollbar{display:none;}

.fbtn.act{background:#36505d;color:#fff;border-color:#36505d;}

.tile{background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:8px 6px 14px;cursor:pointer;position:relative;text-align:center;min-height:60px;-webkit-tap-highlight-color:transparent;}
.tile.dirty{background:#FEF3F2;border-color:#F09595;}
.tile.zr{background:#E24B4A;border-color:#A32D2D;}
.tile.clean{background:#EAF3DE;border-color:#C0DD97;}
.tile.inspect{background:#E6F1FB;border-color:#85B7EB;}
.tile.ooo{background:#F1EFE8;border-color:#D3D1C7;}
.tile.timing{border:2px solid #FAC775;background:#FAEEDA;}
.tile.sel{outline:2.5px solid #36505d;outline-offset:1px;}
.tile .rnum{font-size:16px;font-weight:600;color:#36505d;}
.tile.zr .rnum{color:#fff;}
.tile.dirty .rnum{color:#791F1F;}
.tile.timing .rnum{color:#412402;}
.tile.clean .rnum{color:#27500A;}
.tile.inspect .rnum{color:#0C447C;}
.tile.ooo .rnum{color:#5F5E5A;}

.tile .du-badge{position:absolute;top:5px;left:5px;font-size:9px;font-weight:700;background:#59320f;color:#fff;padding:1px 5px;border-radius:6px;}
.tile .dep-badge{position:absolute;bottom:3px;right:5px;font-size:12px;line-height:1;}
.du-badge-inline{font-size:10px;background:#59320f;color:#fff;padding:2px 7px;border-radius:7px;font-weight:500;}
.du-check-row{display:flex;align-items:center;gap:8px;padding:8px 0 10px;border-bottom:.5px solid #f0efe9;margin-bottom:6px;}
.du-check-row label{font-size:13px;display:flex;align-items:center;gap:7px;cursor:pointer;}
.du-type-row{display:flex;gap:8px;padding:0 0 10px;border-bottom:.5px solid #f0efe9;margin-bottom:6px;}
.du-type-btn{font-size:12px;padding:5px 12px;border-radius:7px;border:1px solid #ddd9cc;background:#fff;color:#444;cursor:pointer;}
.du-type-btn.act{background:#59320f;color:#fff;border-color:#59320f;}
.res-comment-box{background:#fff8e6;border:1px solid #f0dca0;border-radius:8px;padding:8px 10px;margin:10px 0;}
.res-comment-lbl{font-size:11px;font-weight:600;color:#8a6a1f;margin-bottom:3px;}
.res-comment-txt{font-size:13px;color:#444;white-space:pre-wrap;}
.hk-log-list{margin-top:10px;border-top:.5px solid #f0efe9;padding-top:8px;display:flex;flex-direction:column;gap:6px;}
.hk-log-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;}
.hk-log-room{color:#444;flex:1;}
.hk-log-time{color:#888;}
.hk-log-dur{font-weight:600;min-width:54px;text-align:right;}
.du-list-card{background:#fff;border:1px solid #efece3;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

.du-list-prop{font-size:11px;color:#888;}

.hk-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:.5px solid #f0efe9;}

.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.hk-name{font-size:13px;font-weight:500;}
.hk-load{font-size:11px;color:#888;}
.asgn-btn{font-size:11px;padding:5px 11px;border-radius:8px;border:.5px solid #ccc;background:transparent;cursor:pointer;color:#333;}

.action-btn{width:100%;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
.btn-start{background:#c8882a;color:#fff;}
.btn-done{background:#36505d;color:#fff;}
.timer-box{background:#FAEEDA;border:1px solid #FAC775;border-radius:10px;padding:13px;text-align:center;margin:8px 0;}
.timer-lbl{font-size:11px;color:#633806;margin-bottom:3px;}
.timer-val{font-size:32px;font-weight:700;color:#412402;letter-spacing:3px;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;color:#888;}
.leg-dot{width:10px;height:10px;border-radius:50%;}
.rule-card{background:#fff;border-radius:10px;border:.5px solid #e8e7e4;padding:11px 13px;margin-bottom:8px;border-left-width:3px;}
.rule-card .rt{font-size:13px;font-weight:600;}
.rule-card .rd{font-size:11px;color:#888;margin-top:3px;line-height:1.4;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-top:9px;}

.tog.on{background:#36505d;}
.tog.off{background:#ccc;}
.tog::after{content:'';position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;}

.field-label{font-size:11px;color:#888;margin-bottom:4px;display:block;}

.field-input:focus,.field-select:focus{border-color:#36505d;}
.prop-check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px;}
.prop-check{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 8px;border-radius:8px;border:.5px solid #e8e7e4;background:#fff;}
.prop-check input{accent-color:#36505d;}
.form-err{font-size:11px;color:#A32D2D;margin-top:6px;}
.del-btn{font-size:11px;padding:5px 10px;border-radius:8px;border:.5px solid #F09595;background:#FEF3F2;color:#A32D2D;cursor:pointer;flex-shrink:0;}
.del-btn:disabled{opacity:.4;cursor:not-allowed;}
.screen-center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:#888;text-align:center;padding:24px;}
.spinner{width:28px;height:28px;border:3px solid #e8e7e4;border-top-color:#36505d;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-msg{font-size:13px;color:#A32D2D;max-width:290px;line-height:1.5;}
.retry-btn{padding:9px 22px;border-radius:9px;background:#36505d;color:#fff;border:none;font-size:13px;cursor:pointer;margin-top:4px;}
.login-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#36505d;}

.login-input{width:100%;max-width:280px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:14px;margin-bottom:10px;outline:none;}
.login-input::placeholder{color:rgba(255,255,255,.4);}
.login-input:focus{border-color:rgba(255,255,255,.45);}
.login-btn{width:100%;max-width:280px;padding:12px;border-radius:10px;background:#c8882a;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}
.login-err{font-size:12px;color:#F09595;max-width:280px;text-align:center;margin-top:8px;}

.toast{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;padding:10px 13px;border-radius:10px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.toast.err{background:#A32D2D;color:#fff;}
.toast.ok{background:#36505d;color:#fff;}
.scope-row{display:flex;gap:6px;margin-bottom:10px;}
.break-box{border-radius:10px;padding:10px 13px;text-align:center;margin-bottom:10px;border:1px solid;}
.break-box.idle{background:#EAF3DE;border-color:#C0DD97;}
.break-box.active{background:#FCEBEB;border-color:#F09595;}
.break-val{font-size:22px;font-weight:700;color:#791F1F;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 6px;}
.lang-switch{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);outline:none;cursor:pointer;}
.login-lang{margin-bottom:14px;}
.login-lang select{font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);outline:none;cursor:pointer;}
</style>
</head>

function t(key, vars){
  const lang = (S && S.lang) || 'de';
  let str = (I18N[lang] && I18N[lang][key]) || I18N.de[key] || key;
  if(vars) Object.entries(vars).forEach(([k,v])=>{ str = str.replace('{'+k+'}', v); });
  return str;
}
function duTypeLabel(type){
  const map = {Babybett:'du_type_babycot', Schlafsofa:'du_type_sofabed', Hund:'du_type_dog'};
  return map[type] ? t(map[type]) : type;
}
function duTypeAbbr(type){
  const map = {Babybett:'du_abbr_babycot', Schlafsofa:'du_abbr_sofabed', Hund:'du_abbr_dog'};
  return map[type] ? t(map[type]) : type;
}
function ev_setLang(code){
  S.lang = code;
  try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
  if(S.currentUser){
    usersApiFetch({action:'update', user:{id:S.currentUser.id, lang:code}}).catch(()=>{});
    S.currentUser.lang = code;
    const u = USERS.find(x=>x.id===S.currentUser.id); if(u) u.lang = code;
  }
  render();
}
function langSwitcher(){
  return `<select class="lang-switch" onchange="ev_setLang(this.value)">${LANGS.map(l=>`<option value="${l.code}" ${S.lang===l.code?'selected':''}>${l.label}</option>`).join('')}</select>`;
}

async function loadUsers(){
  try{
    const r = await fetch('/api/users',{cache:'no-store'});
    if(r.ok){ const j = await r.json(); if(Array.isArray(j.users)&&j.users.length) USERS = j.users; }
  }catch(e){ console.warn('[loadUsers] konnte Benutzer nicht laden, nutze Fallback', e.message); }
}

async function loadCompletions(){
  try{
    const r = await fetch('/api/completions',{cache:'no-store'});
    if(r.ok){ const j = await r.json(); if(Array.isArray(j.completions)) S.completedTimes=j.completions; }
  }catch(e){ console.warn('[loadCompletions] konnte Statistik nicht laden', e.message); }
}

async function loadDoubleUps(){
  try{
    const r = await fetch('/api/doubleups',{cache:'no-store'});
    if(r.ok){ const j = await r.json(); const d=j.doubleUps;
      if(d&&typeof d==='object'&&!Array.isArray(d)){
        S.doubleUp={};S.doubleUpType={};S.doubleUpLocked={};
        Object.entries(d).forEach(([k,v])=>{
          // Ältere Einträge hatten kein "need"-Feld — Existenz bedeutete damals immer "muss aufgedoppelt werden"
          S.doubleUp[k]= v&&v.need!==undefined ? !!v.need : true;
          S.doubleUpType[k]=Array.isArray(v?.types)?v.types:[];
          S.doubleUpLocked[k]=!!v?.locked;
        });
      }
    }
  }catch(e){ console.warn('[loadDoubleUps] konnte Aufdoppeln-Status nicht laden', e.message); }
}

async function loadBreaks(){

    const r = await fetch('/api/breaks',{cache:'no-store'});
    if(r.ok){ const j = await r.json(); if(Array.isArray(j.breaks)) S.breakLog=j.breaks; }

}

async function apiFetch(path, method='GET', body=null) {
  const res = await fetch(API, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({path, method, body}),
  });
  const text = await res.text();
  if (!res.ok) {
    let msg = text;
    try { const j = JSON.parse(text); msg = j.error || j.detail || j.title || j.message || (Object.keys(j).length ? text : ''); } catch {}
    throw new Error('HTTP ' + res.status + (msg ? ': ' + msg : ' (keine Detailmeldung von Apaleo)'));
  }
  return text ? JSON.parse(text) : {};
}

async function usersApiFetch(payload) {
  const res = await fetch('/api/users', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload),
  });
  const text = await res.text();
  let json; try { json = text ? JSON.parse(text) : {}; } catch(e) { json = {}; }
  if (!res.ok) throw new Error(json.error || ('HTTP ' + res.status));
  return json;
}

const DOUBLEUP_ABBR={Babybett:'Baby',Schlafsofa:'Sofa',Hund:'Hund'};

async function fetchProperties(allowedIds) {
  const d = await apiFetch('/inventory/v1/properties?pageSize=100');
  return (d.properties||[]).filter(p => p.id in PROPERTY_NAMES && allowedIds.includes(p.id));
}

async function fetchPropertyData(propId) {
  const today = new Date(); today.setHours(0,0,0,0);
  const pad2 = n => String(n).padStart(2,'0');
  const todayStr = today.getFullYear()+'-'+pad2(today.getMonth()+1)+'-'+pad2(today.getDate());
  const fromISO = todayStr+'T00:00:00Z';
  const toISO = todayStr+'T23:59:59Z';
  const [ud, rd, dd] = await Promise.all([
    apiFetch('/inventory/v1/units?propertyId='+propId+'&pageSize=500'),
    apiFetch('/booking/v1/reservations?propertyIds='+propId+'&status=InHouse&pageSize=500'),
    // alle Zimmer mit Abreise HEUTE (egal ob noch InHouse oder schon CheckedOut),
    // damit der Koffer auch nach dem Checkout bis zur Reinigung sichtbar bleibt
    apiFetch('/booking/v1/reservations?propertyIds='+propId+'&status=InHouse&status=CheckedOut&dateFilter=Departure&from='+fromISO+'&to='+toISO+'&pageSize=500'),
  ]);
  const resMap = {};
  (rd.reservations||[]).forEach(r => { const uid = r.unit?.id||r.unitId; if(uid) resMap[uid]=r; });
  const depUnits = new Set();
  (dd.reservations||[]).forEach(r => { const uid = r.unit?.id||r.unitId; if(uid) depUnits.add(uid); });
  return (ud.units||[]).map(u => {
    const res = resMap[u.id];
    const nights = res ? Math.max(0, Math.floor((today - new Date(res.arrival.split('T')[0])) / 86400000)) : 0;
    return { id:u.id, n:u.name, c:(u.status?.condition||u.condition)||'Clean', o:!!res||u.status?.isOccupied, nights, dT:depUnits.has(u.id), cm:res?.comment||'' };
  });
}

const rKey    = (p,n) => p+'_'+n;
const isZR    = u => u.c==='Dirty'&&u.o&&u.nights>=2&&u.nights%2===0&&!u.dT;
const getCond = (u,p) => S.conditions[rKey(p,u.n)]||u.c;
const fmtDur  = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fmtDurL = s => { const m=Math.floor(s/60); return m<1?s+'s':m+' min '+s%60+'s'; };
const fmtTime = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const tcls    = c => ({Clean:'clean',Dirty:'dirty',CleanToBeInspected:'inspect',OutOfService:'ooo',OutOfOrder:'ooo'}[c]||'dirty');
const hasDU   = k => !!S.doubleUp[k] || (S.doubleUpType[k]||[]).length>0;

function visibleHKs(){
  const cu=S.currentUser;
  if(!cu) return USERS.filter(u=>u.role==='housekeeper');
  if(cu.props.includes('alle')) return USERS.filter(u=>u.role==='housekeeper');
  return USERS.filter(u=>u.role==='housekeeper'&&(u.props.includes('alle')||u.props.some(p=>cu.props.includes(p))));
}

function getStats(p) {
  let dirty=0,zr=0,insp=0,clean=0;
  (S.units[p]||[]).forEach(u=>{const c=getCond(u,p);if(isZR(u)&&c==='Dirty')zr++;else if(c==='Dirty')dirty++;else if(c==='CleanToBeInspected')insp++;else if(c==='Clean')clean++;});
  return{dirty,zr,insp,clean};
}
function getHKs(p){ return USERS.filter(u=>u.role==='housekeeper'&&(u.props.includes(p)||u.props.includes('alle'))); }
function getWL(uid,p){ return Object.entries(S.assignments).filter(([k,v])=>v===uid&&k.startsWith(p+'_')).length; }
function stopTimerIv(){ if(timerIv){clearInterval(timerIv);timerIv=null;} }
function maybeTimerIv(){
  const k=S.selRoom?rKey(S.prop,S.selRoom.n):null;
  const hasRoomTimer=k&&!!S.timers[k];
  const hasBreak=S.currentUser&&!!S.breakActive[S.currentUser.id];
  if(!hasRoomTimer&&!hasBreak) return;
  timerIv=setInterval(()=>{
    let alive=false;
    if(hasRoomTimer){
      const el=document.getElementById('live-timer');
      if(el&&S.timers[k]){ el.textContent=fmtDur(Math.floor((Date.now()-S.timers[k].start)/1000)); alive=true; }
    }
    const ba=S.currentUser&&S.breakActive[S.currentUser.id];
    if(ba){
      const el2=document.getElementById('live-break');
      if(el2){ el2.textContent=fmtDur(Math.floor((Date.now()-ba.start)/1000)); alive=true; }
    }
    if(!alive) stopTimerIv();
  },1000);
}

function STATS_PERIODS(){ return {today:t('period_today'),month:t('period_month'),ytd:t('period_ytd')}; }
function statsFrom(period){
  const now=new Date();
  if(period==='today'){ const d=new Date();d.setHours(0,0,0,0); return d.getTime(); }
  if(period==='month'){ return new Date(now.getFullYear(),now.getMonth(),1).getTime(); }
  return new Date(now.getFullYear(),0,1).getTime();
}
function scrStats(){
  const period=S.statsPeriod||'today';
  const PERIODS=STATS_PERIODS();
  const from=statsFrom(period);
  const all=S.completedTimes.filter(tm=>tm.ts>=from);
  const allBreaks=S.breakLog.filter(b=>b.start>=from);
  const tot=all.length,avg=tot?Math.round(all.reduce((s,tm)=>s+tm.duration,0)/tot):0;
  const fast=tot?Math.min(...all.map(tm=>tm.duration)):0;
  const hks=visibleHKs();
  const maxA=Math.max(1,...hks.map(h=>{const ht=all.filter(tm=>tm.uid===h.id);return ht.length?Math.round(ht.reduce((s,tm)=>s+tm.duration,0)/ht.length):0;}));
  return `<div class="filter-row">${Object.entries(PERIODS).map(([k,l])=>`<button class="fbtn${period===k?' act':''}" onclick="ev_statsPeriod('${k}')">${l}</button>`).join('')}</div>
  <div class="stat-row">
    <div class="stat"><div class="n">${tot}</div><div class="l">${t('stat_room_count')}</div></div>
    <div class="stat"><div class="n">${tot?fmtDur(avg):'—'}</div><div class="l">${t('stat_avg_time')}</div></div>
    <div class="stat"><div class="n">${fast?fmtDur(fast):'—'}</div><div class="l">${t('stat_fastest')}</div></div>
  </div>
  <div class="sec-title">${t('performance_title',{period:PERIODS[period].toLowerCase()})}</div>
  ${hks.map(h=>{const ht=all.filter(tm=>tm.uid===h.id),cnt=ht.length,a=cnt?Math.round(ht.reduce((s,tm)=>s+tm.duration,0)/cnt):0,pct=a?Math.round(a/maxA*100):0;
  const hb=allBreaks.filter(b=>b.uid===h.id),bTotal=hb.reduce((s,b)=>s+b.duration,0);
  const open=S.statsPerson===h.id;
  const timeline=[...ht.map(tm=>({type:'clean',ts:tm.ts,t:tm})),...hb.map(b=>({type:'break',ts:b.end,b}))].sort((x,y)=>y.ts-x.ts);
  return`<div class="stat-card" style="cursor:pointer;" onclick="ev_statsPerson('${h.id}')"><div style="display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:9px;"><div class="avatar" style="width:34px;height:34px;font-size:12px;background:${h.bg};color:${h.tx}">${h.id}</div>
    <div><div style="font-size:13px;font-weight:500;">${h.name}</div><div style="font-size:11px;color:#888;">${h.props.join(', ')}</div></div></div>
    <div style="text-align:right;"><div style="font-size:14px;font-weight:600;">${cnt} ${t('rooms_word')}</div><div style="font-size:11px;color:#888;">Ø ${a?fmtDurL(a):'—'}</div></div>
  </div>${a?`<div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${h.bg};"></div></div>`:''}
  <div style="font-size:11px;color:#888;margin-top:6px;">☕ ${hb.length} ${t('breaks_label')}${bTotal?' · '+fmtDurL(bTotal):''}</div>
  ${open?`<div class="hk-log-list">${timeline.length?timeline.map(e=>e.type==='clean'?`<div class="hk-log-row">
      <span class="hk-log-room">${t('log_room_prefix')} ${e.t.room} · ${e.t.prop}</span>
      <span class="hk-log-time">${fmtTime(e.t.ts-e.t.duration*1000)} – ${fmtTime(e.t.ts)}</span>
      <span class="hk-log-dur">${fmtDurL(e.t.duration)}</span>
    </div>`:`<div class="hk-log-row">
      <span class="hk-log-room">☕ ${t('break_word')}</span>
      <span class="hk-log-time">${fmtTime(e.b.start)} – ${fmtTime(e.b.end)}</span>
      <span class="hk-log-dur">${fmtDurL(e.b.duration)}</span>
    </div>`).join(''):`<p style="font-size:12px;color:#888;text-align:center;padding:8px 0;">${t('no_entries',{period:PERIODS[period].toLowerCase()})}</p>`}</div>`:''}
  </div>`;}).join('')}
  ${all.length?`<div class="sec-title" style="margin-top:12px;">${t('last_completions')}</div>
  <div class="stat-card">${all.slice(-8).reverse().map(tm=>{const u=USERS.find(x=>x.id===tm.uid);
  return`<div class="log-row"><div style="display:flex;align-items:center;gap:7px;"><div class="avatar" style="width:24px;height:24px;font-size:9px;background:${u?u.bg:'#eee'};color:${u?u.tx:'#666'}">${tm.uid}</div><span style="font-size:12px;">${t('log_room_prefix')} ${tm.room} · ${tm.prop}</span></div><span style="font-size:12px;font-weight:600;">${fmtDurL(tm.duration)}</span></div>`;}).join('')}</div>`
  :`<p style="font-size:12px;color:#888;text-align:center;padding:20px 0;">${t('no_cleanings_yet',{period:PERIODS[period].toLowerCase()})}</p>`}`;
}

function scrDoubleUps(){
  const keys=Array.from(new Set([...Object.keys(S.doubleUp),...Object.keys(S.doubleUpType)])).filter(hasDU);
  if(!keys.length) return `<p style="font-size:12px;color:#888;text-align:center;padding:30px 0;">${t('no_doubleup_rooms')}</p>`;
  const rows=keys.map(k=>{
    const i=k.indexOf('_'); const prop=i>-1?k.slice(0,i):k; const room=i>-1?k.slice(i+1):'';
    return { k, prop, room, types:S.doubleUpType[k]||[] };
  }).sort((a,b)=>(a.prop+a.room).localeCompare(b.prop+b.room));
  return `<div class="sec-title">${t('doubled_rooms_title',{n:rows.length})}</div>
  ${rows.map(r=>`<div class="du-list-card">
    <div><div class="du-list-room">${t('room_word')} ${r.room}</div><div class="du-list-prop">${PROPERTY_NAMES[r.prop]||r.prop}</div></div>
    <div class="du-list-types">${r.types.length?r.types.map(tp=>`<span class="du-type-btn act" style="cursor:default;">${duTypeLabel(tp)}</span>`).join(''):`<span style="font-size:11px;color:#aaa;">${t('no_type_chosen')}</span>`}</div>
  </div>`).join('')}`;
}

function scrRules(){
  return`<div class="sec-title">${t('rules_title')}</div>
  ${[{id:1,name:t('rule1_name'),desc:t('rule1_desc'),tc:'#A32D2D',bg:'#FCEBEB'},
    {id:2,name:t('rule2_name'),desc:t('rule2_desc'),tc:'#27500A',bg:'#EAF3DE'},
    {id:3,name:t('rule3_name'),desc:t('rule3_desc'),tc:'#0C447C',bg:'#E6F1FB'}
  ].map(r=>`<div class="rule-card" style="border-left-color:${r.tc};background:${r.bg};">
    <div class="rt" style="color:${r.tc}">${r.name}</div><div class="rd">${r.desc}</div>
    <div class="toggle-row"><span style="font-size:11px;color:#888;">${t('rule_active')}</span>
    <button class="tog${S.rtog[r.id]?' on':' off'}" onclick="ev_tog(${r.id})"></button></div>
  </div>`).join('')}`;
}

function scrTeam(){
  const today=new Date();today.setHours(0,0,0,0);
  const tt=S.completedTimes.filter(tm=>tm.ts>=today.getTime());
  return`<div class="sec-title">${t('admins_title')}</div>
  ${USERS.filter(u=>u.role==='admin').map(u=>`<div class="team-card"><div style="display:flex;align-items:center;gap:10px;">
    <div class="avatar" style="width:38px;height:38px;font-size:13px;background:${u.bg};color:${u.tx}">${u.id}</div>
    <div><div style="display:flex;align-items:center;gap:7px;"><span style="font-size:14px;font-weight:500;">${u.name}</span><span class="role-pill ra">${t('role_admin')}</span></div>
    <div style="font-size:11px;color:#888;margin-top:2px;">${t('full_access')}</div></div></div></div>`).join('')}
  <div class="sec-title" style="margin-top:14px;">${t('housekeepers_title')}</div>
  ${visibleHKs().map(u=>`<div class="team-card"><div style="display:flex;align-items:center;gap:10px;">
    <div class="avatar" style="width:38px;height:38px;font-size:13px;background:${u.bg};color:${u.tx}">${u.id}</div>
    <div style="flex:1;"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;"><span style="font-size:14px;font-weight:500;">${u.name}</span><span class="role-pill rh">${t('role_hk')}</span></div>
    <div style="font-size:11px;color:#888;margin-top:2px;">${u.props.join(', ')} · ${tt.filter(tm=>tm.uid===u.id).length} ${t('today_done')} · ${getWL(u.id,S.prop||'')} ${t('assigned_count')}</div></div></div></div>`).join('')}`;
}

function scrUsers(){
  const editing = !!S.editUserId;
  const eu = editing ? USERS.find(u=>u.id===S.editUserId) : null;
  const allPropsChecked = eu ? (eu.props.includes('alle')) : false;
  const form = S.userFormOpen ? `<div class="panel">
    <h3>${editing?t('edit_user_title'):t('new_user_title')}</h3>
    <div class="field-group"><label class="field-label">${t('field_username')}</label>
      <input id="nu-id" class="field-input" placeholder="z.B. JS" autocomplete="off" ${editing?'disabled':''} value="${editing?eu.id:''}"></div>
    <div class="field-group"><label class="field-label">${t('field_name')}</label>
      <input id="nu-name" class="field-input" placeholder="z.B. Julia Schmidt" autocomplete="off" value="${editing?(eu.name||'').replace(/"/g,'&quot;'):''}"></div>
    <div class="field-group"><label class="field-label">${editing?t('field_password_edit_hint'):t('field_password')}</label>
      <input id="nu-pass" class="field-input" placeholder="${t('field_password')}" autocomplete="off"></div>
    <div class="field-group"><label class="field-label">${t('field_role')}</label>
      <select id="nu-role" class="field-select">
        <option value="housekeeper" ${editing&&eu.role==='housekeeper'?'selected':''}>${t('role_hk')}</option>
        <option value="admin" ${editing&&eu.role==='admin'?'selected':''}>${t('role_admin')}</option>
      </select></div>
    <div class="field-group"><label class="field-label">${t('field_props')}</label>
      <div class="prop-check-grid">
        <label class="prop-check"><input type="checkbox" id="nu-prop-alle" onclick="ev_toggleAllProps(this.checked)" ${allPropsChecked?'checked':''}> ${t('all_houses')}</label>
        ${Object.keys(PROPERTY_NAMES).map(p=>`<label class="prop-check"><input type="checkbox" class="nu-prop" value="${p}" ${(editing&&!allPropsChecked&&eu.props.includes(p))?'checked':''} ${allPropsChecked?'disabled':''}> ${PROPERTY_NAMES[p]}</label>`).join('')}
      </div></div>
    <div class="field-group"><label class="field-label">${t('field_language')}</label>
      <select id="nu-lang" class="field-select">
        ${LANGS.map(l=>`<option value="${l.code}" ${editing&&eu.lang===l.code?'selected':((!editing&&l.code===S.lang)?'selected':'')}>${l.label}</option>`).join('')}
      </select></div>
    ${S.userFormErr?`<div class="form-err">${S.userFormErr}</div>`:''}
    <button class="action-btn btn-done" ${S.userBusy?'disabled':''} onclick="ev_saveUser()">${S.userBusy?(editing?t('saving_user'):t('creating_user')):(editing?t('save_user_btn'):t('create_user_btn'))}</button>
  </div>` : '';

  return `${form}
  <button class="add-user-btn" onclick="ev_toggleUserForm()">${S.userFormOpen?t('cancel_btn'):t('new_user_btn')}</button>
  <div class="sec-title">${t('admins_title')}</div>
  ${USERS.filter(u=>u.role==='admin').map(u=>userRow(u)).join('')}
  <div class="sec-title" style="margin-top:14px;">${t('housekeepers_title')}</div>
  ${visibleHKs().map(u=>userRow(u)).join('')}`;
}

function userRow(u){
  const isSelf = S.currentUser && S.currentUser.id===u.id;
  return `<div class="team-card"><div style="display:flex;align-items:center;gap:10px;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
      <div class="avatar" style="width:38px;height:38px;font-size:13px;background:${u.bg};color:${u.tx};flex-shrink:0;">${u.id}</div>
      <div style="min-width:0;"><div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;"><span style="font-size:14px;font-weight:500;">${u.name}</span><span class="role-pill ${u.role==='admin'?'ra':'rh'}">${u.role==='admin'?t('role_admin'):t('role_hk')}</span></div>
      <div style="font-size:11px;color:#888;margin-top:2px;">${userProps(u).includes('alle')||u.props.includes('alle')?t('all_houses'):u.props.map(p=>PROPERTY_NAMES[p]||p).join(', ')}</div></div>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0;">
      <button class="del-btn" onclick="ev_editUser('${u.id}')">${t('edit_btn')}</button>
      <button class="del-btn" ${isSelf?`disabled title="${t('cant_delete_self')}"`:''} onclick="ev_deleteUser('${u.id}')">${t('delete_btn')}</button>
    </div>
  </div></div>`;
}

function ev_toggleUserForm(){ S.userFormOpen=!S.userFormOpen; S.userFormErr=''; S.editUserId=null; document.getElementById('hkc').innerHTML=buildScreen(); }
function ev_editUser(id){ S.editUserId=id; S.userFormOpen=true; S.userFormErr=''; document.getElementById('hkc').innerHTML=buildScreen(); window.scrollTo({top:0,behavior:'smooth'}); }
function ev_toggleAllProps(checked){
  document.querySelectorAll('.nu-prop').forEach(cb=>{ cb.checked=false; cb.disabled=checked; });
}
async function ev_saveUser(){
  const editing = !!S.editUserId;
  const id = editing ? S.editUserId : (document.getElementById('nu-id').value||'').trim().toUpperCase();
  const name = (document.getElementById('nu-name').value||'').trim();
  const pass = (document.getElementById('nu-pass').value||'').trim();
  const role = document.getElementById('nu-role').value;
  const lang = document.getElementById('nu-lang').value;
  const allProps = document.getElementById('nu-prop-alle').checked;
  const props = allProps ? ['alle'] : Array.from(document.querySelectorAll('.nu-prop:checked')).map(cb=>cb.value);

  if(editing){
    if(!name){ S.userFormErr=t('err_fill_fields_edit'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
  }else{
    if(!id||!name||!pass){ S.userFormErr=t('err_fill_fields'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
    if(USERS.some(u=>u.id.toLowerCase()===id.toLowerCase())){ S.userFormErr=t('err_username_exists'); document.getElementById('hkc').innerHTML=buildScreen(); return; }
  }
  if(!props.length){ S.userFormErr=t('err_pick_house'); document.getElementById('hkc').innerHTML=buildScreen(); return; }

  S.userBusy=true; S.userFormErr=''; document.getElementById('hkc').innerHTML=buildScreen();
  try{
    if(editing){
      const user = {id,name,role,props,lang};
      if(pass) user.pass = pass;
      await usersApiFetch({action:'update',user});
      const u = USERS.find(x=>x.id===id);
      if(u) Object.assign(u,user);
      S.userBusy=false; S.userFormOpen=false; S.editUserId=null;
      if(S.currentUser && S.currentUser.id===id) Object.assign(S.currentUser,user);
      showToast(t('user_updated',{name}),'ok');
    }else{
      const col = pickColor(id);
      const user = {id,name,pass,role,props,lang,bg:col.bg,tx:col.tx};
      await usersApiFetch({action:'create',user});
      USERS.push(user);
      S.userBusy=false; S.userFormOpen=false;
      showToast(t('user_created',{name}),'ok');
    }
  }catch(e){
    S.userBusy=false; S.userFormErr=t('err_generic',{msg:e.message});
    document.getElementById('hkc').innerHTML=buildScreen();
  }
}
async function ev_deleteUser(id){
  if(S.currentUser && S.currentUser.id===id) return;
  if(!confirm(t('confirm_delete',{id}))) return;
  try{
    await usersApiFetch({action:'delete',id});
    const idx = USERS.findIndex(u=>u.id===id);
    if(idx>-1) USERS.splice(idx,1);
    showToast(t('user_deleted'),'ok');
    render();
  }catch(e){ showToast(t('delete_error',{msg:e.message}),'err'); }
}

function matchUser(input){
  const v=(input||'').trim().toLowerCase();
  if(!v) return null;
  return USERS.find(u=>u.id.toLowerCase()===v||u.name.toLowerCase()===v||u.name.split(' ')[0].toLowerCase()===v);
}
function ev_login(){
  const uVal=document.getElementById('li-user').value;
  const pVal=document.getElementById('li-pass').value;
  const user=matchUser(uVal);
  if(!user||user.pass!==pVal){ S.loginError=t('login_err'); render(); return; }
  doLogin(user);
}
function doLogin(user){
  S.loggedIn=true; S.currentUser=user; S.role=user.role; S.loginError='';
  S.prop=null; S.properties=[]; S.units={}; S.selRoom=null; S.screen='rooms'; S.filter='all'; S.hkScope='mine';
  if(user.lang){ S.lang=user.lang; try{ localStorage.setItem(LANG_KEY,user.lang); }catch(e){} }
  try{ localStorage.setItem(LOGIN_KEY,user.id); }catch(e){}
  init();
}
function ev_logout(){
  S.loggedIn=false; S.currentUser=null; S.loginError='';
  S.prop=null; S.properties=[]; S.units={}; S.selRoom=null;
  try{ localStorage.removeItem(LOGIN_KEY); }catch(e){}
  render();
}
async function ev_prop(p){
  if(S.prop===p) return; S.prop=p;S.selRoom=null;S.filter='all';
  if(!S.units[p]){ S.loadingProp=true;render();
    try{ S.units[p]=await fetchPropertyData(p); }catch(e){ S.units[p]=[]; }
    S.loadingProp=false; }
  render();
}
function ev_screen(s){ S.screen=s;S.selRoom=null;render(); }
function ev_filter(f){ S.filter=f;render(); }
function ev_hkScope(s){ S.hkScope=s; render(); }
function ev_statsPeriod(p){ S.statsPeriod=p; document.getElementById('hkc').innerHTML=buildScreen(); }
function ev_statsPerson(uid){ S.statsPerson=S.statsPerson===uid?null:uid; document.getElementById('hkc').innerHTML=buildScreen(); }
function ev_tog(id){ S.rtog[id]=!S.rtog[id];render(); }
function ev_sel(n){ S.selRoom=S.selRoom?.n===n?null:{n,prop:S.prop}; stopTimerIv(); document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv(); }
function ev_assign(k,uid){ S.assignments[k]===uid?delete S.assignments[k]:(S.assignments[k]=uid); document.getElementById('hkc').innerHTML=buildScreen(); }

function persistDoubleUp(k){
  const need=!!S.doubleUp[k], types=S.doubleUpType[k]||[], locked=!!S.doubleUpLocked[k];
  if(!need&&!types.length){
    delete S.doubleUp[k]; delete S.doubleUpType[k]; delete S.doubleUpLocked[k];
    pushDoubleUp('clear',k).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  } else {
    pushDoubleUp('set',k,types,locked,need).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  }
}
function ev_toggleDoubleUp(k){
  S.doubleUp[k]=!S.doubleUp[k];
  if(S.doubleUp[k]&&!S.doubleUpType[k]) S.doubleUpType[k]=[];
  persistDoubleUp(k);
  document.getElementById('hkc').innerHTML=buildScreen();
}
function ev_setDoubleUpType(k,dtp){
  const a=S.doubleUpType[k]||(S.doubleUpType[k]=[]); const i=a.indexOf(dtp); i>-1?a.splice(i,1):a.push(dtp);
  persistDoubleUp(k);
  document.getElementById('hkc').innerHTML=buildScreen();
}
function ev_startTimer(k){
  if(hasDU(k)&&S.doubleUpLocked[k]){
    delete S.doubleUp[k]; delete S.doubleUpType[k]; delete S.doubleUpLocked[k];
    pushDoubleUp('clear',k).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_reset',{msg:r.msg||t('unknown_error')}),'err'); });
  }
  S.timers[k]={start:Date.now(),uid:S.currentUser.id}; document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
}
async function ev_toggleBreak(){
  const uid=S.currentUser.id;
  const active=S.breakActive[uid];
  if(active){
    const end=Date.now(),duration=Math.floor((end-active.start)/1000);
    delete S.breakActive[uid];
    const entry={uid,start:active.start,end,duration};
    S.breakLog.push(entry);
    stopTimerIv(); document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
    const r=await pushBreak(entry);
    if(!r.ok) showToast(t('err_break_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  } else {
    S.breakActive[uid]={start:Date.now()};
    stopTimerIv(); document.getElementById('hkc').innerHTML=buildScreen(); maybeTimerIv();
  }
}
async function ev_inspect(k){
  let entry=null;
  if(S.timers[k]){ const dur=Math.floor((Date.now()-S.timers[k].start)/1000),pts=k.split('_');
    entry={uid:S.timers[k].uid,prop:pts[0],room:pts.slice(1).join('_'),duration:dur,ts:Date.now()};
    S.completedTimes.push(entry); delete S.timers[k]; }
  S.conditions[k]='CleanToBeInspected'; S.selRoom=null;
  if(hasDU(k)&&!S.doubleUpLocked[k]){
    S.doubleUpLocked[k]=true;
    pushDoubleUp('set',k,S.doubleUpType[k]||[],true,!!S.doubleUp[k]).then(r=>{ if(!r.ok) showToast(t('err_doubleup_not_saved',{msg:r.msg||t('unknown_error')}),'err'); });
  }
  const u=(S.units[S.prop]||[]).find(x=>x.n===k.split('_').slice(1).join('_'));
  if(u) u.c='CleanToBeInspected';
  render();
  if(u?.id){
    const r=await pushCondition(u.id,'CleanToBeInspected');
    if(!r.ok) showToast(t('err_condition_not_synced',{msg:r.msg||t('unknown_error')}),'err');
  }
  if(entry){
    const r=await pushCompletion(entry);
    if(!r.ok) showToast(t('err_completion_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
}

async function ev_completeDoubleUp(k){
  let entry=null;
  if(S.timers[k]){ const dur=Math.floor((Date.now()-S.timers[k].start)/1000),pts=k.split('_');
    entry={uid:S.timers[k].uid,prop:pts[0],room:pts.slice(1).join('_'),duration:dur,ts:Date.now()};
    S.completedTimes.push(entry); delete S.timers[k]; }
  S.selRoom=null;
  S.doubleUp[k]=false; S.doubleUpType[k]=[]; S.doubleUpLocked[k]=false;
  persistDoubleUp(k);
  render();
  if(entry){
    const r=await pushCompletion(entry);
    if(!r.ok) showToast(t('err_completion_not_saved',{msg:r.msg||t('unknown_error')}),'err');
  }
}

async function ev_completeInspection(k){
  S.conditions[k]='Clean'; S.selRoom=null;
  const u=(S.units[S.prop]||[]).find(x=>x.n===k.split('_').slice(1).join('_'));
  if(u) u.c='Clean';
  render();
  if(u?.id){
    const r=await pushCondition(u.id,'Clean');
    if(!r.ok) showToast(t('err_condition_not_synced',{msg:r.msg||t('unknown_error')}),'err');
  }
}

async function init(){
  await Promise.all([loadUsers(), loadCompletions(), loadDoubleUps(), loadBreaks()]);
  if(!S.loggedIn){
    try{
      const savedId=localStorage.getItem(LOGIN_KEY);
      const saved=savedId?USERS.find(u=>u.id===savedId):null;
      if(saved){ S.loggedIn=true; S.currentUser=saved; S.role=saved.role; if(saved.lang) S.lang=saved.lang; }
    }catch(e){}
  }
  if(!S.loggedIn){ render(); return; }

  document.getElementById('app').innerHTML=`<div class="screen-center"><div class="spinner"></div><p style="font-size:13px">${t('loading_apaleo')}</p></div>`;
  try{
    const allowed=userProps(S.currentUser);
    const props=await fetchProperties(allowed);
    S.properties=props.length>0?props:allowed.filter(id=>id in PROPERTY_NAMES).map(id=>({id,name:PROPERTY_NAMES[id]}));
    S.prop=S.properties[0]?.id||allowed[0];
    S.loadingProp=true; render();
    S.units[S.prop]=await fetchPropertyData(S.prop);
    S.loadingProp=false; render();
  }catch(e){
    document.getElementById('app').innerHTML=`<div class="screen-center">
      <p style="font-size:22px">⚠️</p>
      <p class="err-msg">${e.message}</p>
      <button class="retry-btn" onclick="init()">${t('retry_btn')}</button>
      <button style="margin-top:10px;background:none;border:none;color:#888;font-size:12px;text-decoration:underline;cursor:pointer;" onclick="ev_logout()">${t('logout_btn')}</button>
    </div>`;
  }
}

init();
</script>
</body>
</html>
